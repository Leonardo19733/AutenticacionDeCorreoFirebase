<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
</head>
<body>
  <h2>Iniciar Sesión con Verificación de Correo</h2>
  
  <div id="login-form">
    <input type="email" id="email" placeholder="Ingresa tu correo electrónico" required />
    <button id="btn-login">Enviar enlace de acceso</button>
  </div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getAuth, 
    sendSignInLinkToEmail, 
    isSignInWithEmailLink, 
    signInWithEmailLink 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADVKhK9boZGRs56EnXhkr5eFSx58-f6no", 
    authDomain: "inicio-sesion-16ab1.firebaseapp.com",
    projectId: "inicio-sesion-16ab1",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  if (isSignInWithEmailLink(auth, window.location.href)) {
    let email = window.localStorage.getItem('emailForSignIn');

    if (!email) {
      email = window.prompt('Por favor, introduce tu correo electrónico para confirmar el acceso:');
    }

    if (email) {
      signInWithEmailLink(auth, email, window.location.href)
        .then((result) => {
          window.localStorage.removeItem('emailForSignIn');
          
          alert(`¡Sesión iniciada con éxito! Bienvenido, ${result.user.email}`);
          console.log("Datos de usuario:", result.user);
          

        })
        .catch((error) => {
          console.error("Error al completar el acceso:", error);
          alert(`Error al iniciar sesión: ${error.message}`);
        });
    }
  }
  const emailInput = document.getElementById("email");
  const loginButton = document.getElementById("btn-login");

  const actionCodeSettings = {
    url: 'https://inicio-sesion-16ab1.web.app', 
    handleCodeInApp: true,
  };

  loginButton.addEventListener("click", async () => {
    const email = emailInput.value;
    if (!email) {
      alert("Por favor, ingresa un correo válido.");
      return;
    }
    try {
      await sendSignInLinkToEmail(auth, email, actionCodeSettings);
      window.localStorage.setItem('emailForSignIn', email);
      alert(`Revisa tu papu correo ${email}`);
    } catch (error) {
      console.error("Error al enviar el enlace:", error);
      alert(`Ocurrió un error: ${error.message}`);
    }
  });

</script>
</body>


</html>
